name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - linux
          - windows
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag name (e.g. v0.1.0; leave blank to use version from tauri.conf.json)'
        required: false
        type: string
        default: ''
      release_draft:
        description: 'Create release as draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: game-launcher

jobs:
  build-linux:
    name: Build Linux (x86_64)
    if: inputs.platform == 'all' || inputs.platform == 'linux' || !inputs.platform
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'game-launcher/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            game-launcher/src-tauri -> game-launcher/src-tauri/target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        working-directory: game-launcher
        run: npm ci

      - name: Run unit tests
        working-directory: game-launcher
        run: npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: game-launcher

      - name: Prepare Linux artifacts
        run: |
          VERSION=$(node -p "require('./game-launcher/src-tauri/tauri.conf.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p dist
          [ -f "game-launcher/src-tauri/target/release/tauri-app" ] && cp "game-launcher/src-tauri/target/release/tauri-app" "dist/${APP_NAME}-${VERSION}-linux-x86_64"
          for f in game-launcher/src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] && cp "$f" "dist/${APP_NAME}-${VERSION}.AppImage"
          done
          for f in game-launcher/src-tauri/target/release/bundle/deb/*.deb; do
            [ -f "$f" ] && cp "$f" "dist/${APP_NAME}-${VERSION}.deb"
          done
          chmod +x dist/* 2>/dev/null || true

      - name: Upload Linux Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-linux-x86_64
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-linux-x86_64
          if-no-files-found: warn

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.AppImage
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.AppImage
          if-no-files-found: warn

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.deb
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.deb
          if-no-files-found: warn

  build-windows:
    name: Build Windows (x86_64)
    if: inputs.platform == 'all' || inputs.platform == 'windows' || !inputs.platform
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'game-launcher/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            game-launcher/src-tauri -> game-launcher/src-tauri/target

      - name: Install dependencies
        working-directory: game-launcher
        run: npm ci

      - name: Run unit tests
        working-directory: game-launcher
        run: npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: game-launcher

      - name: Prepare Windows artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./game-launcher/src-tauri/tauri.conf.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p dist
          [ -f "game-launcher/src-tauri/target/release/tauri-app.exe" ] && cp "game-launcher/src-tauri/target/release/tauri-app.exe" "dist/${APP_NAME}-${VERSION}.exe"
          for f in game-launcher/src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" "dist/${APP_NAME}-installer-${VERSION}.exe"
          done
          for f in game-launcher/src-tauri/target/release/bundle/msi/*.msi; do
            [ -f "$f" ] && cp "$f" "dist/${APP_NAME}-installer-${VERSION}.msi"
          done

      - name: Upload Windows Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.exe
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.exe
          if-no-files-found: warn

      - name: Upload Windows Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-installer-${{ env.APP_VERSION }}.exe
          path: dist/${{ env.APP_NAME }}-installer-${{ env.APP_VERSION }}.exe
          if-no-files-found: warn

      - name: Upload Windows Installer MSI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-installer-${{ env.APP_VERSION }}.msi
          path: dist/${{ env.APP_NAME }}-installer-${{ env.APP_VERSION }}.msi
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'push' || inputs.create_release != false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine tag and release name
        run: |
          VERSION=$(node -p "require('./game-launcher/src-tauri/tauri.conf.json').version")
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          draft: ${{ inputs.release_draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: release-artifacts/*
