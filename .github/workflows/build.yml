name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - linux
          - windows
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag name (e.g. v0.1.0; leave blank to use version from tauri.conf.json)'
        required: false
        type: string
        default: ''
      release_draft:
        description: 'Create release as draft'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    if: inputs.platform == 'all' || inputs.platform == 'linux' || !inputs.platform
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'game-launcher/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            game-launcher/src-tauri -> game-launcher/src-tauri/target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        working-directory: game-launcher
        run: npm ci

      - name: Run unit tests
        working-directory: game-launcher
        run: npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: game-launcher
          tagName: ${{ inputs.create_release && (inputs.release_tag != '' && inputs.release_tag || 'v__VERSION__') || '' }}
          releaseName: ${{ inputs.create_release && (inputs.release_tag != '' && inputs.release_tag || 'App v__VERSION__') || '' }}
          releaseDraft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.prerelease }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-linux-x86_64
          path: |
            game-launcher/src-tauri/target/release/bundle/deb/*.deb
            game-launcher/src-tauri/target/release/bundle/appimage/*.AppImage
            game-launcher/src-tauri/target/release/tauri-app
          if-no-files-found: warn

  build-windows:
    name: Build Windows (x86_64)
    if: inputs.platform == 'all' || inputs.platform == 'windows' || !inputs.platform
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'game-launcher/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            game-launcher/src-tauri -> game-launcher/src-tauri/target

      - name: Install dependencies
        working-directory: game-launcher
        run: npm ci

      - name: Run unit tests
        working-directory: game-launcher
        run: npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: game-launcher
          tagName: ${{ inputs.create_release && (inputs.release_tag != '' && inputs.release_tag || 'v__VERSION__') || '' }}
          releaseName: ${{ inputs.create_release && (inputs.release_tag != '' && inputs.release_tag || 'App v__VERSION__') || '' }}
          releaseDraft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.prerelease }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-windows-x86_64
          path: |
            game-launcher/src-tauri/target/release/bundle/nsis/*.exe
            game-launcher/src-tauri/target/release/bundle/msi/*.msi
            game-launcher/src-tauri/target/release/tauri-app.exe
          if-no-files-found: warn
